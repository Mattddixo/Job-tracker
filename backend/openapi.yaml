openapi: 3.0.3
info:
  title: Home Jobs Tracker API
  description: >
    Self-hosted API for tracking household jobs/projects (repairs, renovations,
    contractor work) with quoted-vs-actual cost and time comparison.
  version: "1.0.0"
servers:
  - url: /api/v1

security:
  - ApiKeyAuth: []

tags:
  - name: Jobs
  - name: Job Notes
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness/readiness probe (unauthenticated, outside /api/v1)
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /jobs:
    get:
      tags: [Jobs]
      summary: List jobs with optional filtering and sorting
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/JobStatus"
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [CREATED_AT, UPDATED_AT, SCHEDULED_DATE, COMPLETED_DATE, COST_VARIANCE, TIME_VARIANCE, TITLE]
            default: CREATED_AT
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpsertRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Jobs]
      summary: Get a job by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Jobs]
      summary: Replace a job's fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpsertRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Jobs]
      summary: Delete a job (cascades to its notes and attachments)
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /jobs/{id}/notes:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Job Notes]
      summary: List timeline notes for a job (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobNote"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Job Notes]
      summary: Add a timeline note to a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobNoteCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobNote"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /jobs/{id}/notes/{noteId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: noteId
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Job Notes]
      summary: Delete a timeline note
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Static API key, sent as `Authorization: Bearer <API_KEY>`.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    JobStatus:
      type: string
      enum: [QUOTED, SCHEDULED, IN_PROGRESS, DONE, CANCELLED]

    PaymentStatus:
      type: string
      enum: [UNPAID, PARTIAL, PAID]

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
        details:
          type: array
          items:
            type: string

    JobUpsertRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        category:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        vendorName:
          type: string
          nullable: true
        vendorContact:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/JobStatus"
        quotedCost:
          type: number
          nullable: true
        actualCost:
          type: number
          nullable: true
        predictedHours:
          type: number
          nullable: true
        actualHours:
          type: number
          nullable: true
        scheduledDate:
          type: string
          format: date
          nullable: true
        completedDate:
          type: string
          format: date
          nullable: true
        warrantyExpiry:
          type: string
          format: date
          nullable: true
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        paymentMethod:
          type: string
          nullable: true

    Job:
      allOf:
        - $ref: "#/components/schemas/JobUpsertRequest"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            costVariance:
              type: number
              nullable: true
              description: actualCost - quotedCost, derived (never stored)
            timeVariance:
              type: number
              nullable: true
              description: actualHours - predictedHours, derived (never stored)
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    JobNoteCreateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 5000

    JobNote:
      allOf:
        - $ref: "#/components/schemas/JobNoteCreateRequest"
        - type: object
          required: [id, jobId, timestamp]
          properties:
            id:
              type: integer
              format: int64
            jobId:
              type: integer
              format: int64
            timestamp:
              type: string
              format: date-time
